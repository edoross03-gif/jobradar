# Job Radar company registry: example. Copy to config/companies.yaml and make it yours.
# One entry per supported job-board adapter, so every adapter can be tried with `dry-run --only <key>`.
# Fields: name, key (auto from name if omitted), tier (A/B/C), bucket, ats, slug, config, careers_url, notes, enabled
# - `ats` empty -> run `python -m jobradar discover --write` to resolve it (review the report first)
# - tier decides alerting: tiers in INSTANT_TIERS alert on every run, the others go into the daily digest
# - bucket is a free label (fintech, bank, consulting, ...) passed to the LLM scorer
companies:
- name: Amazon
  key: amazon
  tier: B
  bucket: bigtech
  ats: amazon
  slug: amazon
  careers_url: https://www.amazon.jobs
- name: OpenAI
  key: openai
  tier: B
  bucket: ai
  ats: ashby
  slug: openai
  careers_url: https://openai.com/careers
- name: UniCredit
  key: unicredit
  tier: B
  bucket: banking
  ats: avature
  slug: careers.unicredit.eu
  careers_url: https://careers.unicredit.eu/
  config:
    host: careers.unicredit.eu
    lang: en_GB
    section: jobsuche
- name: Bending Spoons
  key: bending-spoons
  tier: B
  bucket: bigtech
  ats: bendingspoons
  slug: bending-spoons
  careers_url: https://jobs.bendingspoons.com/
- name: Banque Internationale à Luxembourg
  key: bil
  tier: B
  bucket: banking
  ats: cornerstone
  slug: bil
  careers_url: https://stayforacareer.com/
  config:
    corp: bil
